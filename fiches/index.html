<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiches de révision</title>
<meta name="theme-color" content="#F4F1EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fiches.css">
</head>
<body>
<main id="app" style="gap:16px">
  <div><div class="row between"><div class="small muted" style="font-weight:700">Apprentissage de la conduite</div><a class="small" href="../" style="font-weight:700">Jour J ›</a></div><h1 style="font-size:28px;font-weight:800;line-height:1.1">Fiches de révision</h1></div>
  <p class="muted" style="margin:0;line-height:1.5">Des animations et des schémas pour revoir ce que tu as travaillé en leçon. Choisis une fiche.</p>
  <div id="list" class="stack" style="gap:12px"></div>
  <p class="footer">Fiches créées par ton enseignant. Elles complètent ses explications en leçon. Rien n'est collecté.</p>
</main>
<script src="fiches.js"></script>
<script>
(function () {
  'use strict';
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const F = window.FICHES || {};
  document.getElementById('list').innerHTML = Object.values(F).map((f) => {
    const url = f.url;
    return `<div class="card stack" style="gap:8px"><h2 style="font-size:20px">${esc(f.titre)}</h2>
      ${(f.parts || [['Ouvrir la fiche', '']]).map(([t, h]) => `<a class="pill" href="${url}${h}" style="justify-content:space-between">▶ ${esc(t)} <span aria-hidden="true">›</span></a>`).join('')}</div>`;
  }).join('');
})();
</script>
</body>
</html>
